name: Tests

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

permissions:
  contents: read

# Superseded pushes to the same branch cancel their outdated runs.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # `build` runs the test suite AND produces the distributable remapped
      # mod jar (loom), so every green run proves the artifact players will
      # actually download is buildable — not just the sources.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: test-results
          path: build/reports/tests/

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: solidus-enforcer-jar
          path: build/libs/*.jar
