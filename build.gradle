plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://repo1.maven.org/maven2/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // solidus-api — the Minecraft-free contract jar Solidus Core ships
    // (nested in the core mod jar). Compiling against the local copy keeps
    // Enforcer self-contained: every Core call is compile-checked instead
    // of reflective (audit W-5 closure, 2.3.2 — replaces the 15 cached
    // Method handles over Core internals incl. ShopManager/
    // TransactionLog/SQLiteStorage records). fabric.mod.json declares
    // "depends": { "solidus": ">=2.3.2 <3.0.0" } so the loader — not a
    // log line — rejects incompatible combinations.
    compileOnly files("libs/solidus-api-2.3.2.jar")
    testImplementation files("libs/solidus-api-2.3.2.jar")

    implementation "com.google.code.gson:gson:${project.gson_version}"
    implementation "org.xerial:sqlite-jdbc:${project.sqlite_version}"
    include "org.xerial:sqlite-jdbc:${project.sqlite_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version as int
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    filesMatching('fabric.mod.json') {
        expand(version: project.version,
               minecraft_version: project.minecraft_version,
               loader_version: project.loader_version,
               fabric_api_version: project.fabric_api_version)
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
    manifest {
        attributes(
            'Implementation-Title': project.archives_base_name,
            'Implementation-Version': project.version
        )
    }
}
